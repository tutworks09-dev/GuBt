<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuBt Game Center</title>

<style>
:root {
  --bg: #081006;
  --panel: #111d0c;
  --green: #4C9700;
  --text: #f2ffe9;
  --muted: #a2b997;
  --border: #4C970044;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #243d12, #081006 65%);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 5%;
  background: #081006dd;
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 23px;
  font-weight: 900;
}

.logo span {
  color: var(--green);
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: #4C970018;
  color: #a5d66d;
  font-size: 12px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 28px 18px 60px;
}

.hero {
  min-height: 250px;
  padding: 35px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  border-radius: 23px;
  border: 1px solid var(--border);
  background:
    linear-gradient(90deg, #071207ee, #07120777),
    url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1400&q=85')
    center/cover;
}

.hero h1 {
  font-size: clamp(32px, 6vw, 52px);
  margin: 0 0 12px;
  line-height: 1.1;
}

.hero h1 span {
  color: #4C9700;
}

.hero p {
  margin: 0;
  color: #d1e5c5;
  font-size: 14px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 30px 0 16px;
}

.section-head h2 {
  font-size: 21px;
  margin: 0;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
  gap: 17px;
}

.game-card {
  overflow: hidden;
  background: linear-gradient(145deg, #192b10, #0d1909);
  border: 1px solid var(--border);
  border-radius: 20px;
  transition: .2s;
}

.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--green);
  box-shadow: 0 12px 30px #4C970022;
}

.cover {
  height: 165px;
  background-position: center;
  background-size: cover;
  position: relative;
}

.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent, #08100688);
}

.card-content {
  padding: 18px;
}

.card-content h3 {
  margin: 0 0 8px;
  font-size: 19px;
}

.card-content p {
  margin: 0 0 17px;
  color: var(--muted);
  font-size: 13px;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 11px;
  padding: 11px 19px;
  font: inherit;
  transition: .2s;
}

.primary {
  background: linear-gradient(120deg, #4C9700, #65ad13);
  color: white;
  font-weight: 800;
}

.primary:hover {
  filter: brightness(1.2);
  transform: translateY(-2px);
  box-shadow: 0 5px 20px #4C970055;
}

footer {
  text-align: center;
  padding: 23px;
  border-top: 1px solid var(--border);
  color: #829775;
  font-size: 12px;
}

footer span {
  color: var(--green);
}

@media(max-width: 560px) {
  header {
    padding: 15px 4%;
  }

  .hero {
    min-height: 210px;
    padding: 24px;
  }

  .games {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">GuBt <span>Games</span></div>

  <div class="status">
    <span class="dot"></span>
    Updating
  </div>
</header>

<main>

  <section class="hero">
    <div>
      <h1>Out For <span>Updates</span></h1>
      <p>Bot is updating. Stay tuned!</p>
    </div>
  </section>

  <div class="section-head">
    <h2>Stay Connected</h2>
  </div>

  <section class="games">

    <article class="game-card">

      <div class="cover"
        style="background-image:
        linear-gradient(#08100644,#08100644),
        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5FZbERzjpzYAGrndUKkJxaNspT1V5kkFNLASF6HdQPA&s=10')">
      </div>

      <div class="card-content">
        <h3>Telegram</h3>
        <p>Join our Telegram for news.</p>

        <a href="https://t.me/GuBtGames"
           target="_blank"
           rel="noopener noreferrer">
          <button class="primary">Join →</button>
        </a>
      </div>

    </article>

  </section>

</main>

<footer>
  © 2026 <span>GuBt Game Center</span>
</footer>

</body>
</html>
